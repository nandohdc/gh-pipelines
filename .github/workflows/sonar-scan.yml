name: sonar-scan

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing source code and sonar-project.properties."
        type: string
        required: false
        default: "."
      quality-gate-timeout-minutes:
        description: "Maximum time in minutes to wait for quality gate status."
        type: string
        required: false
        default: "5"
      extra-scan-args:
        description: "Extra arguments passed to SonarQube scanner."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo "hello from sonar-scan reusable workflow"
