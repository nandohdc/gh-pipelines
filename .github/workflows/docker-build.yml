# =============================================================================
# docker-build.yml — Reusable Docker build + push workflow
# =============================================================================
# Builds a Docker image and optionally pushes to GHCR.
# On pull requests: build only (no push).
# On push to default branch: build + push.
#
# Example Caller workflow:
#   jobs:
#     docker:
#       uses: nandohdc/gh-pipelines/.github/workflows/docker-build.yml@v1
#       with:
#         image-name: ghcr.io/nandohdc/my-app
# =============================================================================

name: docker-build

on:
  workflow_call:
    inputs:
      image-name:
        description: "Full image name including registry (e.g. ghcr.io/nandohdc/my-app)."
        type: string
        required: true
      context:
        description: "Docker build context path."
        type: string
        required: false
        default: "."
      dockerfile:
        description: "Path to Dockerfile relative to the repository root."
        type: string
        required: false
        default: "Dockerfile"
      push:
        description: "Push image to registry. Set false for build-only validation."
        type: boolean
        required: false
        default: true
      platforms:
        description: "Comma-separated target platforms (e.g. linux/amd64,linux/arm64)."
        type: string
        required: false
        default: "linux/amd64"
      build-args:
        description: "Newline-separated Docker build arguments."
        type: string
        required: false
        default: ""
      extra-tags:
        description: "Extra docker/metadata-action tag rules."
        type: string
        required: false
        default: ""
      generate-sbom:
        description: "Generate SPDX and CycloneDX SBOM artifacts for pushed images."
        type: boolean
        required: false
        default: false
      generate-provenance:
        description: "Generate SLSA provenance attestation for pushed images."
        type: boolean
        required: false
        default: false
      sign-image:
        description: "Sign pushed image digest with cosign keyless signing."
        type: boolean
        required: false
        default: false
      attest-sbom:
        description: "Emit the SPDX SBOM as a cosign attestation (cosign attest --type spdxjson) on the pushed image digest."
        type: boolean
        required: false
        default: false
      runner-label:
        description: "Self-hosted runner label. Empty uses ubuntu-latest."
        type: string
        required: false
        default: ""
    outputs:
      digest:
        description: "Image digest (sha256:...)."
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: "Newline-separated pushed image tags."
        value: ${{ jobs.build.outputs.tags }}
      metadata:
        description: "JSON build result metadata."
        value: ${{ jobs.build.outputs.metadata }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      metadata: ${{ steps.build.outputs.metadata }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: nandohdc/gh-pipelines/actions/docker-meta@v1
        with:
          image-name: ${{ inputs.image-name }}
          extra-tags: ${{ inputs.extra-tags }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sbom:
    name: sbom
    if: ${{ inputs.generate-sbom && inputs.push && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.build.outputs.digest != '' }}
    needs: build
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: read
      actions: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM artifacts
        uses: nandohdc/gh-pipelines/actions/supply-chain-attest@v1
        with:
          image-name: ${{ inputs.image-name }}
          image-digest: ${{ needs.build.outputs.digest }}
          generate-sbom: "true"
          platforms: ${{ inputs.platforms }}
          sbom-artifact-suffix: ${{ github.run_id }}

  sign-image:
    name: sign-image
    if: ${{ inputs.sign-image && inputs.push && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.build.outputs.digest != '' }}
    needs: build
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image digest
        uses: nandohdc/gh-pipelines/actions/supply-chain-attest@v1
        with:
          image-name: ${{ inputs.image-name }}
          image-digest: ${{ needs.build.outputs.digest }}
          sign-image: "true"

      # Self-verify in the workflow (not the action) so an older supply-chain-attest@v1
      # that silently no-ops cannot leave this job green with no signature.
      - name: Ensure envsubst is available for cosign installer
        if: ${{ inputs.runner-label != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v envsubst >/dev/null 2>&1; then
            exit 0
          fi
          if [ "$(uname -s)" != "Linux" ]; then
            echo "envsubst is missing: automatic gettext-base install is only supported on Linux runners. Install gettext-base in the runner image." >&2
            exit 1
          fi
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "envsubst is missing and apt-get is unavailable. Install gettext-base in the runner image." >&2
            exit 1
          fi
          # Privilege-aware install: root containers have no sudo; locked-down ARC/self-hosted
          # images have no passwordless sudo. Running sudo unconditionally breaks both (issue #102).
          if [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y gettext-base
          elif sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gettext-base
          else
            echo "envsubst is missing and gettext-base cannot be installed: not running as root and passwordless sudo is unavailable. Install gettext-base in the runner image (apt-get install -y gettext-base)." >&2
            exit 1
          fi
          command -v envsubst >/dev/null 2>&1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify image signature
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/nandohdc/gh-pipelines/\.github/workflows/docker-build\.yml@refs/.+$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

  attest-sbom:
    name: attest-sbom
    if: ${{ inputs.attest-sbom && inputs.push && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.build.outputs.digest != '' }}
    needs: build
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      actions: write
      id-token: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest SPDX SBOM
        uses: nandohdc/gh-pipelines/actions/supply-chain-attest@v1
        with:
          image-name: ${{ inputs.image-name }}
          image-digest: ${{ needs.build.outputs.digest }}
          attest-sbom: "true"
          platforms: ${{ inputs.platforms }}
          sbom-artifact-suffix: attest-${{ github.run_id }}

      # Fail closed: verify the attestation in the workflow itself. If the resolved
      # supply-chain-attest@v1 lacks the attest-sbom step (ref drift), no attestation
      # is produced and this step turns the job red instead of passing silently.
      - name: Ensure envsubst is available for cosign installer
        if: ${{ inputs.runner-label != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v envsubst >/dev/null 2>&1; then
            exit 0
          fi
          if [ "$(uname -s)" != "Linux" ]; then
            echo "envsubst is missing: automatic gettext-base install is only supported on Linux runners. Install gettext-base in the runner image." >&2
            exit 1
          fi
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "envsubst is missing and apt-get is unavailable. Install gettext-base in the runner image." >&2
            exit 1
          fi
          # Privilege-aware install: root containers have no sudo; locked-down ARC/self-hosted
          # images have no passwordless sudo. Running sudo unconditionally breaks both (issue #102).
          if [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y gettext-base
          elif sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gettext-base
          else
            echo "envsubst is missing and gettext-base cannot be installed: not running as root and passwordless sudo is unavailable. Install gettext-base in the runner image (apt-get install -y gettext-base)." >&2
            exit 1
          fi
          command -v envsubst >/dev/null 2>&1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify SPDX SBOM attestation
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          # --new-bundle-format=false matches the legacy .att DSSE tag scheme that
          # actions/supply-chain-attest pins on the cosign attest side. cosign v3's
          # default new bundle format (OCI 1.1 referrers) is not reliably retrievable on
          # GHCR, so verify-attestation fails with "no valid bundles exist in registry"
          # (issue #104). Identity/issuer/tlog checks below are unchanged — still fail-closed.
          cosign verify-attestation \
            --new-bundle-format=false \
            --type spdxjson \
            --certificate-identity-regexp '^https://github\.com/nandohdc/gh-pipelines/\.github/workflows/docker-build\.yml@refs/.+$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

  provenance:
    name: provenance
    if: ${{ inputs.generate-provenance && inputs.push && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.build.outputs.digest != '' }}
    needs: build
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Generate provenance attestation
        uses: nandohdc/gh-pipelines/actions/supply-chain-attest@v1
        with:
          image-name: ${{ inputs.image-name }}
          image-digest: ${{ needs.build.outputs.digest }}
          generate-provenance: "true"
