# =============================================================================
# docker-release.yml — Reusable supply-chain security release workflow
# =============================================================================
# Builds a release image, generates SBOMs (SPDX + CycloneDX), signs with
# cosign (keyless / Sigstore), generates SLSA provenance, and attaches
# artifacts to the GitHub Release.
#
# Trigger: usually on tag push (refs/tags/*) after CI passes.
#
# Example caller:
#   jobs:
#     release:
#       uses: nandohdc/gh-pipelines/.github/workflows/docker-release.yml@v1
#       with:
#         image-name: ghcr.io/nandohdc/my-app
# =============================================================================

name: docker-release

on:
  workflow_call:
    inputs:
      image-name:
        description: "Full image name including registry."
        type: string
        required: true
      context:
        description: "Docker build context path."
        type: string
        required: false
        default: "."
      dockerfile:
        description: "Path to Dockerfile."
        type: string
        required: false
        default: "Dockerfile"
      platforms:
        description: "Comma-separated target platforms."
        type: string
        required: false
        default: "linux/amd64"
      build-args:
        description: "Newline-separated Docker build arguments."
        type: string
        required: false
        default: ""
      attach-sbom-to-release:
        description: "Attach SBOM files to the GitHub Release."
        type: boolean
        required: false
        default: true
      runner-label:
        description: "Self-hosted runner label. Empty uses ubuntu-latest."
        type: string
        required: false
        default: ""
    outputs:
      digest:
        description: "Image digest (sha256:...)."
        value: ${{ jobs.release.outputs.digest }}

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: release
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=ref,event=tag

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Supply-chain security artifacts ---

      - name: Generate SBOMs, sign image, and emit provenance
        uses: nandohdc/gh-pipelines/actions/supply-chain-attest@v1
        with:
          image-name: ${{ inputs.image-name }}
          image-digest: ${{ steps.build.outputs.digest }}
          generate-sbom: "true"
          sign-image: "true"
          generate-provenance: "true"
          platforms: ${{ inputs.platforms }}
          sbom-artifact-suffix: ${{ github.ref_name }}

      - name: Attach SBOM assets to GitHub Release
        if: inputs.attach-sbom-to-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            sbom.spdx.json
            sbom.cyclonedx.json
