# =============================================================================
# docker-release.yml — Reusable supply-chain security release workflow
# =============================================================================
# Builds a release image, generates SBOMs (SPDX + CycloneDX), signs with
# cosign (keyless / Sigstore), generates SLSA provenance, and attaches
# artifacts to the GitHub Release.
#
# Trigger: usually on tag push (refs/tags/*) after CI passes.
#
# Example caller:
#   jobs:
#     release:
#       uses: nandohdc/gh-pipelines/.github/workflows/docker-release.yml@v1
#       with:
#         image-name: ghcr.io/nandohdc/my-app
# =============================================================================

name: docker-release

on:
  workflow_call:
    inputs:
      image-name:
        description: "Full image name including registry."
        type: string
        required: true
      context:
        description: "Docker build context path."
        type: string
        required: false
        default: "."
      dockerfile:
        description: "Path to Dockerfile."
        type: string
        required: false
        default: "Dockerfile"
      platforms:
        description: "Comma-separated target platforms."
        type: string
        required: false
        default: "linux/amd64"
      build-args:
        description: "Newline-separated Docker build arguments."
        type: string
        required: false
        default: ""
      attach-sbom-to-release:
        description: "Attach SBOM files to the GitHub Release."
        type: boolean
        required: false
        default: true
    outputs:
      digest:
        description: "Image digest (sha256:...)."
        value: ${{ jobs.release.outputs.digest }}

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=ref,event=tag

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Supply-chain security artifacts ---

      - name: Generate SBOMs, sign image, and emit provenance
        uses: nandohdc/gh-pipelines/actions/supply-chain-attest@v1
        with:
          image-name: ${{ inputs.image-name }}
          image-digest: ${{ steps.build.outputs.digest }}
          generate-sbom: "true"
          sign-image: "true"
          generate-provenance: "true"
          sbom-artifact-suffix: ${{ github.ref_name }}

      - name: Attach SBOM assets to GitHub Release
        if: inputs.attach-sbom-to-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            sbom.spdx.json
            sbom.cyclonedx.json
