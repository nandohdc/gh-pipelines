# =============================================================================
# docker-release.yml — Reusable supply-chain security release workflow
# =============================================================================
# Builds a release image, generates SBOMs (SPDX + CycloneDX), signs with
# cosign (keyless / Sigstore), generates SLSA provenance, and attaches
# artifacts to the GitHub Release.
#
# Trigger: usually on tag push (refs/tags/*) after CI passes.
#
# Example caller:
#   jobs:
#     release:
#       uses: nandohdc/gh-pipelines/.github/workflows/docker-release.yml@v1
#       with:
#         image-name: ghcr.io/nandohdc/my-app
# =============================================================================

name: docker-release

on:
  workflow_call:
    inputs:
      image-name:
        description: "Full image name including registry."
        type: string
        required: true
      context:
        description: "Docker build context path."
        type: string
        required: false
        default: "."
      dockerfile:
        description: "Path to Dockerfile."
        type: string
        required: false
        default: "Dockerfile"
      platforms:
        description: "Comma-separated target platforms."
        type: string
        required: false
        default: "linux/amd64"
      build-args:
        description: "Newline-separated Docker build arguments."
        type: string
        required: false
        default: ""
      attach-sbom-to-release:
        description: "Attach SBOM files to the GitHub Release."
        type: boolean
        required: false
        default: true
    outputs:
      digest:
        description: "Image digest (sha256:...)."
        value: ${{ jobs.release.outputs.digest }}

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=ref,event=tag

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Supply-chain security artifacts ---

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-spdx-${{ github.ref_name }}
          upload-artifact: true
          upload-release-assets: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom-cyclonedx-${{ github.ref_name }}
          upload-artifact: true
          upload-release-assets: false

      - name: Attach SBOM assets to GitHub Release
        if: inputs.attach-sbom-to-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            sbom.spdx.json
            sbom.cyclonedx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign release image (keyless)
        run: cosign sign --yes "${{ inputs.image-name }}@${{ steps.build.outputs.digest }}"

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
