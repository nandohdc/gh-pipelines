name: sonar-selftest

on:
  workflow_dispatch:
  push:
    branches:
      - phase-2-branch

jobs:
  sonar:
    uses: ./.github/workflows/sonar-scan.yml
    with:
      working-directory: "."
      quality-gate-timeout-minutes: 5
      extra-scan-args: ""
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      sonar_host_url: ${{ secrets.SONAR_HOST_URL }}
