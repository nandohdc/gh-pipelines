# =============================================================================
# helm-deploy.yml — Reusable Helm deploy workflow
# =============================================================================
# Runs `helm upgrade --install` against a DigitalOcean Kubernetes cluster.
# Authorization runs before acquiring cluster credentials:
# - push to the repository default branch: real deploy with --atomic and optional
#   post-deploy kubectl commands (`deploy / <release-name>`).
# - same-repository pull_request: dry-run only with --dry-run --debug and no
#   post-deploy kubectl (`deploy (dry-run) / <release-name>`).
# - feature-branch push, fork pull_request, workflow_dispatch (disabled by
#   default), pull_request_target, and all other events: rejected before
#   acquiring cloud credentials or running Helm / kubectl.
#
# Example Caller workflow:
#   jobs:
#     deploy:
#       uses: nandohdc/gh-pipelines/.github/workflows/helm-deploy.yml@v2
#       with:
#         release-name: my-app
#         chart: ./chart
#         namespace: my-app
#         values-file: values.yaml
#       secrets:
#         digitalocean-token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
# =============================================================================

name: helm-deploy

on:
  workflow_call:
    inputs:
      release-name:
        description: "Helm release name."
        type: string
        required: true
      chart:
        description: "Helm chart reference (repo/chart or local path)."
        type: string
        required: true
      namespace:
        description: "Kubernetes namespace."
        type: string
        required: true
      values-file:
        description: "Path to values.yaml."
        type: string
        required: true
      chart-version:
        description: "Chart version (omit for local charts)."
        type: string
        required: false
        default: ""
      cluster-id:
        description: "DigitalOcean Kubernetes cluster UUID."
        type: string
        required: false
        default: "adc9fd65-81f6-46f3-b3d1-6112298faf0a"
      timeout:
        description: "Helm operation timeout."
        type: string
        required: false
        default: "10m"
      extra-helm-args:
        description: "Additional arguments passed to helm upgrade."
        type: string
        required: false
        default: ""
      post-deploy-kubectl:
        description: |
          Newline-separated kubectl commands to run after a successful
          deploy (ignored on dry-run). Example:
            kubectl apply -f platform/cert-manager/cluster-issuers.yaml
            kubectl apply -f platform/external-secrets/cluster-secret-store.yaml
        type: string
        required: false
        default: ""
      extra-helm-repos:
        description: |
          Extra Helm repos (name=url, newline-separated).
        type: string
        required: false
        default: ""
      runner-label:
        description: "Self-hosted runner label. Empty uses ubuntu-latest."
        type: string
        required: false
        default: ""
    secrets:
      digitalocean-token:
        description: "DigitalOcean Personal Access Token."
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && format('deploy (dry-run) / {0}', inputs.release-name) || format('deploy / {0}', inputs.release-name) }}
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authorize deployment context
        id: authorize
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_FULL: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          PULL_REQUEST_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PULL_REQUEST_HEAD_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail

          case "${DEFAULT_BRANCH:-}" in
            "")
              echo "::error::Cannot authorize Helm deployment: repository default branch is empty."
              exit 1
              ;;
            *$'\n'*|*$'\r'*)
              echo "::error::Cannot authorize Helm deployment: repository default branch contains invalid characters."
              exit 1
              ;;
          esac

          default_ref="refs/heads/${DEFAULT_BRANCH}"
          mode=""
          acquire_credentials="false"
          allow_post_deploy="false"

          case "${GITHUB_EVENT_NAME:-}" in
            push)
              if [[ "${GITHUB_REF_FULL:-}" != "${default_ref}" ]]; then
                echo "::error::Automatic Helm deployment is only permitted for pushes to the default branch (${default_ref}); received ref '${GITHUB_REF_FULL:-}'."
                exit 1
              fi
              mode="deploy"
              acquire_credentials="true"
              allow_post_deploy="true"
              ;;
            pull_request)
              if [[ "${PULL_REQUEST_HEAD_FORK:-}" == "true" ]] \
                || [[ -z "${PULL_REQUEST_HEAD_REPOSITORY:-}" ]] \
                || [[ "${PULL_REQUEST_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY_NAME:-}" ]]; then
                echo "::error::Helm pull_request dry-run refuses untrusted or fork pull request contexts (repository='${GITHUB_REPOSITORY_NAME:-}', head='${PULL_REQUEST_HEAD_REPOSITORY:-}', fork='${PULL_REQUEST_HEAD_FORK:-}')."
                exit 1
              fi
              mode="dry-run"
              acquire_credentials="true"
              allow_post_deploy="false"
              ;;
            workflow_dispatch)
              echo "::error::Manual Helm deployment (workflow_dispatch) is disabled by default; automatic deployment is limited to default-branch pushes (${default_ref})."
              exit 1
              ;;
            pull_request_target|*)
              echo "::error::Unsupported event '${GITHUB_EVENT_NAME:-}' for Helm deployment; only default-branch push (${default_ref}) and same-repository pull_request dry-run are permitted."
              exit 1
              ;;
          esac

          {
            printf 'mode=%s\n' "${mode}"
            printf 'acquire-credentials=%s\n' "${acquire_credentials}"
            printf 'allow-post-deploy=%s\n' "${allow_post_deploy}"
          } >> "${GITHUB_OUTPUT}"

          {
            printf 'HELM_DEPLOY_MODE=%s\n' "${mode}"
            printf 'HELM_ACQUIRE_CREDENTIALS=%s\n' "${acquire_credentials}"
            printf 'HELM_ALLOW_POST_DEPLOY=%s\n' "${allow_post_deploy}"
          } >> "${GITHUB_ENV}"

          echo "::notice::Authorized Helm workflow context: event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF_FULL:-} mode=${mode} post_deploy=${allow_post_deploy}."

      - name: Setup doctl + kubeconfig
        if: steps.authorize.outputs.acquire-credentials == 'true' && (steps.authorize.outputs.mode == 'deploy' || steps.authorize.outputs.mode == 'dry-run')
        uses: nandohdc/gh-pipelines/actions/setup-doctl@v1
        with:
          digitalocean-token: ${{ secrets.digitalocean-token }}
          cluster-id: ${{ inputs.cluster-id }}

      - name: Setup Helm + repos
        if: steps.authorize.outputs.mode == 'deploy' || steps.authorize.outputs.mode == 'dry-run'
        uses: nandohdc/gh-pipelines/actions/setup-helm@v1
        with:
          extra-repos: ${{ inputs.extra-helm-repos }}

      - name: Deploy (or dry-run on PR)
        if: steps.authorize.outputs.mode == 'deploy' || steps.authorize.outputs.mode == 'dry-run'
        shell: bash
        env:
          HELM_RELEASE_NAME: ${{ inputs.release-name }}
          HELM_CHART: ${{ inputs.chart }}
          HELM_NAMESPACE: ${{ inputs.namespace }}
          HELM_VALUES_FILE: ${{ inputs.values-file }}
          HELM_TIMEOUT: ${{ inputs.timeout }}
          HELM_CHART_VERSION: ${{ inputs.chart-version }}
          HELM_EXTRA_ARGS: ${{ inputs.extra-helm-args }}
          HELM_DEPLOY_MODE: ${{ steps.authorize.outputs.mode }}
        run: |
          set -euo pipefail

          case "${HELM_DEPLOY_MODE:-}" in
            deploy|dry-run) ;;
            *)
              echo "::error::Refusing to run Helm with unauthorized deploy mode '${HELM_DEPLOY_MODE:-}'."
              exit 1
              ;;
          esac

          cmd=(
            helm upgrade --install "${HELM_RELEASE_NAME}" "${HELM_CHART}"
            --namespace "${HELM_NAMESPACE}"
            --create-namespace
            --values "${HELM_VALUES_FILE}"
            --atomic
            --timeout "${HELM_TIMEOUT}"
          )

          if [[ -n "${HELM_CHART_VERSION}" ]]; then
            cmd+=(--version "${HELM_CHART_VERSION}")
          fi

          if [[ -n "${HELM_EXTRA_ARGS}" ]]; then
            read -ra extra <<< "${HELM_EXTRA_ARGS}"
            cmd+=("${extra[@]}")
          fi

          if [[ "${HELM_DEPLOY_MODE}" == "dry-run" ]]; then
            cmd+=(--dry-run --debug)
            echo "::notice::Executing pull_request Helm dry-run (not a real deployment) for ${HELM_RELEASE_NAME}."
          else
            echo "::notice::Executing authorized real Helm deployment for ${HELM_RELEASE_NAME}."
          fi

          printf 'Running:'
          for arg in "${cmd[@]}"; do
            printf ' %q' "${arg}"
          done
          printf '\n'
          "${cmd[@]}"

      - name: Post-deploy kubectl commands
        if: steps.authorize.outputs.mode == 'deploy' && steps.authorize.outputs.allow-post-deploy == 'true' && inputs.post-deploy-kubectl != ''
        shell: bash
        env:
          HELM_DEPLOY_MODE: ${{ steps.authorize.outputs.mode }}
          HELM_ALLOW_POST_DEPLOY: ${{ steps.authorize.outputs.allow-post-deploy }}
          POST_DEPLOY_KUBECTL: ${{ inputs.post-deploy-kubectl }}
        run: |
          set -euo pipefail

          if [[ "${HELM_DEPLOY_MODE:-}" != "deploy" ]] || [[ "${HELM_ALLOW_POST_DEPLOY:-}" != "true" ]]; then
            echo "::error::Refusing to run post-deploy kubectl commands outside an authorized deployment (mode='${HELM_DEPLOY_MODE:-}', allow='${HELM_ALLOW_POST_DEPLOY:-}')."
            exit 1
          fi

          while IFS= read -r line; do
            [[ -z "${line}" ]] && continue
            echo "Running: ${line}"
            eval "${line}"
          done <<< "${POST_DEPLOY_KUBECTL}"
