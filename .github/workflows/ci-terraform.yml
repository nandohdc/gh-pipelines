# =============================================================================
# ci-terraform.yml — Reusable Terraform CI pipeline
# =============================================================================
# Runs formatting, validation, planning, and optional IaC audit checks for
# Terraform projects.
#
# Cloud credentials are intentionally caller-managed (environment variables or
# OIDC) and are not configured by this reusable workflow.
#
# Example caller:
#   jobs:
#     ci:
#       uses: nandohdc/gh-pipelines/.github/workflows/ci-terraform.yml@v1
#       with:
#         terraform-version: "1.9.8"
#         working-directory: "infra"
# =============================================================================

name: ci-terraform

on:
  workflow_call:
    inputs:
      terraform-version:
        description: "Terraform version to install."
        type: string
        required: false
        default: "1.9.8"
      working-directory:
        description: "Directory containing Terraform configuration files."
        type: string
        required: false
        default: "."
      var-file:
        description: "Optional var-file passed to terraform plan."
        type: string
        required: false
        default: ""
      backend-config:
        description: "Optional backend config passed to terraform init (key=value or file path)."
        type: string
        required: false
        default: ""
      run-plan:
        description: "Run terraform plan (backend init enabled)."
        type: boolean
        required: false
        default: true
      run-audit:
        description: "Run IaC security audit."
        type: boolean
        required: false
        default: true
      audit-tool:
        description: "Audit tool to run (tfsec|checkov)."
        type: string
        required: false
        default: "tfsec"
      tfsec-additional-args:
        description: "Additional tfsec CLI flags (used only when audit-tool=tfsec)."
        type: string
        required: false
        default: ""
      upload-plan:
        description: "Upload tfplan artifact on pull_request events."
        type: boolean
        required: false
        default: true
      runner-label:
        description: "Self-hosted runner label. Empty uses ubuntu-latest."
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: nandohdc/gh-pipelines/actions/setup-terraform@v1
        with:
          terraform-version: ${{ inputs.terraform-version }}

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive

  validate:
    name: validate
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: nandohdc/gh-pipelines/actions/setup-terraform@v1
        with:
          terraform-version: ${{ inputs.terraform-version }}

      - name: Terraform init (backend disabled)
        shell: bash
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false

      - name: Terraform validate
        shell: bash
        run: |
          set -euo pipefail
          terraform validate

  plan:
    name: plan
    if: inputs.run-plan
    needs:
      - fmt
      - validate
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: nandohdc/gh-pipelines/actions/setup-terraform@v1
        with:
          terraform-version: ${{ inputs.terraform-version }}

      - name: Terraform init (backend enabled)
        shell: bash
        env:
          BACKEND_CONFIG: ${{ inputs.backend-config }}
        run: |
          set -euo pipefail
          init_args=("-input=false")
          if [ -n "${BACKEND_CONFIG}" ]; then
            init_args+=("-backend-config=${BACKEND_CONFIG}")
          fi
          terraform init "${init_args[@]}"

      - name: Terraform plan
        shell: bash
        env:
          VAR_FILE: ${{ inputs.var-file }}
        run: |
          set -euo pipefail
          plan_args=("-out=tfplan" "-input=false")
          if [ -n "${VAR_FILE}" ]; then
            plan_args+=("-var-file=${VAR_FILE}")
          fi
          terraform plan "${plan_args[@]}"

      - name: Upload tfplan artifact
        if: github.event_name == 'pull_request' && inputs.upload-plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: ${{ inputs.working-directory }}/tfplan
          if-no-files-found: error

  audit:
    name: audit
    if: inputs.run-audit
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate audit tool
        shell: bash
        env:
          AUDIT_TOOL: ${{ inputs.audit-tool }}
        run: |
          set -euo pipefail
          case "${AUDIT_TOOL}" in
            tfsec|checkov) ;;
            *)
              echo "::error::Unsupported audit-tool '${AUDIT_TOOL}'. Use tfsec or checkov."
              exit 1
              ;;
          esac

      - name: Run tfsec
        if: inputs.audit-tool == 'tfsec'
        shell: bash
        # Native binary instead of aquasecurity/tfsec-action: that action is a
        # Docker *container* action, which self-hosted runners can't run (macOS
        # forbids container actions; ARC runner pods have no Docker daemon at
        # /var/run/docker.sock). The binary runs on any runner OS/arch. Inputs
        # go through env vars to avoid ${{ }} script injection.
        env:
          TFSEC_VERSION: v1.28.14
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          TFSEC_ADDITIONAL_ARGS: ${{ inputs.tfsec-additional-args }}
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64 | amd64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "::error::unsupported arch '$arch'"; exit 1 ;;
          esac
          bindir="${RUNNER_TEMP:-/tmp}"
          curl -fsSL -o "$bindir/tfsec" \
            "https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-${os}-${arch}"
          chmod +x "$bindir/tfsec"
          # shellcheck disable=SC2086  # additional args must word-split into argv
          "$bindir/tfsec" "$WORKING_DIRECTORY" $TFSEC_ADDITIONAL_ARGS

      - name: Run checkov
        if: inputs.audit-tool == 'checkov'
        uses: bridgecrewio/checkov-action@a7683e7b72a04503521247973281ec8142e1ac1f # v12.3112.0
        with:
          directory: ${{ inputs.working-directory }}
          framework: terraform
          output_format: cli
