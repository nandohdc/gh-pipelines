# =============================================================================
# test-callers.yml — Internal reusable-workflow regression harness
# =============================================================================
# Calls local reusable workflows against minimal in-repo fixtures so PRs validate
# real caller behavior before release tags are moved.
# =============================================================================

name: test-callers

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-ci-go:
    name: test ci-go caller
    uses: ./.github/workflows/ci-go.yml
    with:
      working-directory: tests/fixtures/go
      coverage-min: "0"
      runner-label: ${{ vars.RUNNER_LABEL }}

  test-ci-node:
    name: test ci-node caller
    uses: ./.github/workflows/ci-node.yml
    with:
      working-directory: tests/fixtures/node
      package-manager: npm
      run-audit: false
      runner-label: ${{ vars.RUNNER_LABEL }}

  test-ci-python:
    name: test ci-python caller
    uses: ./.github/workflows/ci-python.yml
    with:
      dependency-file: tests/fixtures/python/requirements.txt
      lint-paths: tests/fixtures/python/src tests/fixtures/python/tests
      test-paths: tests/fixtures/python/tests
      run-audit: false
      runner-label: ${{ vars.RUNNER_LABEL }}

  test-ci-with-sonar-go:
    name: test ci-with-sonar-go caller
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-with-sonar-go.yml
    with:
      working-directory: tests/fixtures/go
      coverage-min: "0"
      __test_skip_sonar_call: true
      runner-label: ${{ vars.RUNNER_LABEL }}
    secrets:
      DOPPLER_TOKEN: ${{ github.token }}

  test-ci-with-sonar-node:
    name: test ci-with-sonar-node caller
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-with-sonar-node.yml
    with:
      working-directory: tests/fixtures/node
      package-manager: npm
      run-audit: false
      __test_skip_sonar_call: true
      runner-label: ${{ vars.RUNNER_LABEL }}
    secrets:
      DOPPLER_TOKEN: ${{ github.token }}

  test-ci-with-sonar-python:
    name: test ci-with-sonar-python caller
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-with-sonar-python.yml
    with:
      dependency-file: tests/fixtures/python/requirements.txt
      lint-paths: tests/fixtures/python/src tests/fixtures/python/tests
      test-paths: tests/fixtures/python/tests
      run-audit: false
      __test_skip_sonar_call: true
      runner-label: ${{ vars.RUNNER_LABEL }}
    secrets:
      DOPPLER_TOKEN: ${{ github.token }}

  # NOTE: Local self-tests cannot catch cross-repo path resolution bugs — ./actions/* resolves fine
  # from within this repo but fails when the workflow is invoked from an external caller.
  test-ci-terraform:
    name: test ci-terraform caller
    uses: ./.github/workflows/ci-terraform.yml
    with:
      working-directory: tests/fixtures/terraform
      run-audit: false
      runner-label: ${{ vars.RUNNER_LABEL }}

  test-ci-terraform-no-plan:
    name: test ci-terraform caller (no plan)
    uses: ./.github/workflows/ci-terraform.yml
    with:
      working-directory: tests/fixtures/terraform
      run-plan: false
      run-audit: false
      runner-label: ${{ vars.RUNNER_LABEL }}

  # Exercises docker-build.yml against the docker fixture. On PRs the attest-sbom
  # job is skipped (build-only, no push). On push to main it builds + pushes the
  # fixture image, runs cosign attest, and the in-workflow self-verify makes the
  # job green only when a real SPDX SBOM attestation exists.
  test-docker-build-attest:
    name: test docker-build caller (attest-sbom)
    permissions:
      contents: read
      packages: write
      actions: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker-build.yml
    with:
      image-name: ghcr.io/${{ github.repository }}/test-docker-fixture
      context: tests/fixtures/docker
      dockerfile: tests/fixtures/docker/Dockerfile
      platforms: linux/amd64
      attest-sbom: true
      runner-label: ${{ vars.RUNNER_LABEL }}
