# =============================================================================
# dependabot-auto-merge.yml — Internal Dependabot auto-merge workflow
# =============================================================================
# Auto-enables merge for low-risk Dependabot updates (patch/minor) while
# leaving major updates for maintainer review.
#
# Safety model:
# - Runs on pull_request_target for access to repository token/permissions.
# - Never checks out PR code.
# - Relies on branch protection required checks before merge completes.
# =============================================================================

name: dependabot-auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot-auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure gh CLI is available (self-hosted runners)
        if: vars.RUNNER_LABEL != ''
        shell: bash
        run: |
          set -euo pipefail

          if command -v gh >/dev/null 2>&1; then
            echo "gh already present: $(gh --version | head -n1)"
            exit 0
          fi

          if ! command -v apt-get >/dev/null 2>&1; then
            echo "gh is missing and apt-get is unavailable. Install the GitHub CLI (gh) in the runner image." >&2
            exit 1
          fi

          # Privilege-aware install: root images have no sudo; locked-down
          # non-root images have no passwordless sudo (mirrors the gettext-base
          # cosign preflight, issue #102).
          sudo_cmd=()
          if [ "$(id -u)" != "0" ]; then
            if sudo -n true 2>/dev/null; then
              sudo_cmd=(sudo)
            else
              echo "gh is missing and cannot be installed: not root and passwordless sudo is unavailable. Install the GitHub CLI (gh) in the runner image." >&2
              exit 1
            fi
          fi

          keyring=/etc/apt/keyrings/githubcli-archive-keyring.gpg
          "${sudo_cmd[@]}" mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | "${sudo_cmd[@]}" tee "${keyring}" >/dev/null
          "${sudo_cmd[@]}" chmod go+r "${keyring}"
          echo "deb [arch=$(dpkg --print-architecture) signed-by=${keyring}] https://cli.github.com/packages stable main" \
            | "${sudo_cmd[@]}" tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          "${sudo_cmd[@]}" apt-get update
          "${sudo_cmd[@]}" apt-get install -y gh
          gh --version

      - name: Enable auto-merge for patch/minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          labels=$(gh pr view "${PR_NUMBER}" --repo "${GH_REPO}" --json labels --jq '.labels[].name')
          if ! echo "${labels}" | grep -qx 'release:patch'; then
            gh pr edit "${PR_NUMBER}" --repo "${GH_REPO}" --add-label 'release:patch'
          fi

          gh pr merge "${PR_NUMBER}" --repo "${GH_REPO}" --auto --squash

      - name: Comment on major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          gh pr comment "${PR_NUMBER}" --repo "${GH_REPO}" --body 'Major update; maintainer review required.'
