name: lint

on:
  pull_request:
    branches:
      - main
      - "release/v[0-9]+"
  push:
    branches:
      - main
      - "release/v[0-9]+"

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Set up Python for yamllint
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install workflow contract test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'PyYAML==6.0.2'

      - name: Static workflow contract tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sonar_scan_workflow_contract_test.py
          python scripts/ci_with_sonar_workflow_contract_test.py
          python scripts/sonar_documentation_contract_test.py
          python scripts/consumer_terminology_contract_test.py
          python scripts/multimodule_go_workflow_contract_test.py
          python scripts/hosted_runner_workflow_contract_test.py
          python scripts/node_setup_workflow_contract_test.py
          python scripts/terraform_documentation_contract_test.py

      - name: Contract library unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest pytest-cov
          python -m pytest scripts/contract_lib_test.py -q --cov=scripts.contract_lib --cov-report=term-missing

      - name: Release behavior tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest scripts/release_test.py -q --cov=scripts.release --cov-report=term-missing

      - name: Canary probe tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest scripts/canary_probe_test.py -q --cov=scripts.canary_probe --cov-report=term-missing

      - name: Candidate smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest scripts/candidate_smoke_test.py -q --cov=scripts.candidate_smoke --cov-report=term-missing

      - name: Install yamllint
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'yamllint==1.35.1'

      - name: yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
