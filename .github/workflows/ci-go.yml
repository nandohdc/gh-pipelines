# =============================================================================
# ci-go.yml — Reusable Go CI pipeline
# =============================================================================
# Runs lint, unit tests, vulnerability checks, and optional integration tests
# for Go projects. Designed to be called from any Go service repository.
#
# Example Caller workflow:
#   jobs:
#     ci:
#       uses: nandohdc/gh-pipelines/.github/workflows/ci-go.yml@v1
#       with:
#         go-version: "1.26.2"
# =============================================================================

name: ci-go

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to install."
        type: string
        required: false
        default: "1.26.2"
      working-directory:
        description: "Directory containing the Go module to lint and test."
        type: string
        required: false
        default: "."
      cache-dependency-path:
        description: "Path to the module's go.sum file for Go caching. Empty resolves to <working-directory>/go.sum."
        type: string
        required: false
        default: ""
      golangci-lint-version:
        description: "golangci-lint version."
        type: string
        required: false
        default: "v1.64.8"
      golangci-lint-major:
        description: "golangci-lint major version used to select the compatible Go module path (1 or 2)."
        type: string
        required: false
        default: "1"
      coverage-min:
        description: "Minimum unit-test coverage percentage."
        type: string
        required: false
        default: "65.0"
      coverage-packages:
        description: "Space-separated package list for coverage. Empty = all."
        type: string
        required: false
        default: ""
      coverage-artifact-name:
        description: "Artifact name used to publish coverage.out. Must be unique when multiple Caller jobs run in one workflow."
        type: string
        required: false
        default: "coverage"
      integration-coverage-artifact-name:
        description: "Artifact name used to publish integration-coverage.out. Must be unique when multiple Caller jobs run in one workflow."
        type: string
        required: false
        default: "integration-coverage"
      run-build:
        description: "Run go build ./... before tests."
        type: boolean
        required: false
        default: false
      run-integration:
        description: "Run integration tests (requires Testcontainers / Docker)."
        type: boolean
        required: false
        default: false
      integration-tags:
        description: "Build tags for integration tests."
        type: string
        required: false
        default: "integration"
      integration-packages:
        description: "Package pattern for integration tests."
        type: string
        required: false
        default: "./internal/..."
      run-contract:
        description: "Run contract checks (make contract)."
        type: boolean
        required: false
        default: false
      run-import-direction:
        description: "Run import direction checks (scripts/check-import-direction.sh)."
        type: boolean
        required: false
        default: false
      run-k8s-validate:
        description: "Validate Kubernetes manifests with kubectl dry-run."
        type: boolean
        required: false
        default: false
      k8s-manifests-dir:
        description: "Path to Kubernetes manifest directory."
        type: string
        required: false
        default: "deploy/kubernetes"
      run-prometheus-validate:
        description: "Validate Prometheus rule files."
        type: boolean
        required: false
        default: false
      prometheus-rules-dir:
        description: "Path to Prometheus rules directory."
        type: string
        required: false
        default: "deploy/prometheus"
      runner-label:
        description: "Self-hosted runner label. Empty uses ubuntu-latest."
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint — formatting, vet, golangci-lint, optional import checks
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build-essential
        if: runner.os == 'Linux' && inputs.runner-label != ''
        shell: bash
        run: |
          if ! command -v gcc &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y build-essential
          fi

      - name: Setup Go
        uses: nandohdc/gh-pipelines/actions/setup-go@v1
        with:
          go-version: ${{ inputs.go-version }}
          working-directory: ${{ inputs.working-directory }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./scripts/check-gofmt.sh ]; then
            ./scripts/check-gofmt.sh
          else
            unformatted=$(gofmt -l .)
            if [ -n "${unformatted}" ]; then
              echo "Files not formatted:"
              echo "${unformatted}"
              exit 1
            fi
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        shell: bash
        env:
          GOLANGCI_LINT_MAJOR: ${{ inputs.golangci-lint-major }}
          GOLANGCI_LINT_VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          set -euo pipefail

          case "${GOLANGCI_LINT_MAJOR}" in
            1)
              go run "github.com/golangci/golangci-lint/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}" run
              ;;
            2)
              go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}" run
              ;;
            *)
              echo "::error::golangci-lint-major must be 1 or 2."
              exit 1
              ;;
          esac

      - name: Import direction checks
        if: inputs.run-import-direction
        run: ./scripts/check-import-direction.sh

  # ---------------------------------------------------------------------------
  # Test — unit tests, coverage, optional contracts
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build-essential
        if: runner.os == 'Linux' && inputs.runner-label != ''
        shell: bash
        run: |
          if ! command -v gcc &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y build-essential
          fi

      - name: Setup Go
        uses: nandohdc/gh-pipelines/actions/setup-go@v1
        with:
          go-version: ${{ inputs.go-version }}
          working-directory: ${{ inputs.working-directory }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Build
        if: inputs.run-build
        run: go build ./...

      - name: Unit tests (race detector)
        run: go test -race ./...

      - name: Coverage threshold
        shell: bash
        env:
          COVERAGE_MIN: ${{ inputs.coverage-min }}
          COVERAGE_PKGS: ${{ inputs.coverage-packages }}
        run: |
          set -euo pipefail

          pkgs="${COVERAGE_PKGS:-./...}"
          IFS=' ' read -r -a pkg_args <<< "${pkgs}"
          go test -coverprofile=coverage.out "${pkg_args[@]}"

          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Coverage: ${coverage}%  Threshold: ${COVERAGE_MIN}%"

          if awk -v c="${coverage}" -v t="${COVERAGE_MIN}" 'BEGIN {exit !(c+0 >= t+0)}'; then
            go tool cover -func=coverage.out | grep total
          else
            echo "::error::Coverage ${coverage}% is below threshold ${COVERAGE_MIN}%"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: ${{ inputs.working-directory }}/coverage.out

      - name: Contract checks
        if: inputs.run-contract
        run: make contract

  # ---------------------------------------------------------------------------
  # Integration — optional, requires Docker (Testcontainers)
  # ---------------------------------------------------------------------------
  integration:
    name: integration
    if: inputs.run-integration
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build-essential
        if: runner.os == 'Linux' && inputs.runner-label != ''
        shell: bash
        run: |
          if ! command -v gcc &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y build-essential
          fi

      - name: Setup Go
        uses: nandohdc/gh-pipelines/actions/setup-go@v1
        with:
          go-version: ${{ inputs.go-version }}
          working-directory: ${{ inputs.working-directory }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Integration tests
        shell: bash
        env:
          INTEGRATION_TAGS: ${{ inputs.integration-tags }}
          INTEGRATION_PACKAGES: ${{ inputs.integration-packages }}
        run: |
          set -euo pipefail
          integration_packages=()
          if [[ -n "${INTEGRATION_PACKAGES}" ]]; then
            read -r -a integration_packages <<< "${INTEGRATION_PACKAGES}"
          fi
          go test -coverprofile=integration-coverage.out \
            "-tags=${INTEGRATION_TAGS}" \
            "${integration_packages[@]}"

      - name: Upload integration coverage
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.integration-coverage-artifact-name }}
          path: ${{ inputs.working-directory }}/integration-coverage.out

  # ---------------------------------------------------------------------------
  # Vulnerability scan
  # ---------------------------------------------------------------------------
  vuln:
    name: vuln
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build-essential
        if: runner.os == 'Linux' && inputs.runner-label != ''
        shell: bash
        run: |
          if ! command -v gcc &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y build-essential
          fi

      - name: Setup Go
        uses: nandohdc/gh-pipelines/actions/setup-go@v1
        with:
          go-version: ${{ inputs.go-version }}
          working-directory: ${{ inputs.working-directory }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: govulncheck
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          mapfile -t packages < <(go list ./... | grep -v '/internal/testutil$')
          govulncheck "${packages[@]}"

  # ---------------------------------------------------------------------------
  # Kubernetes & Prometheus manifest validation (optional)
  # ---------------------------------------------------------------------------
  validate-manifests:
    name: validate-manifests
    if: inputs.run-k8s-validate || inputs.run-prometheus-validate
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up kubectl
        if: inputs.run-k8s-validate
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Create kind cluster
        if: inputs.run-k8s-validate
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

      - name: Validate Kubernetes manifests
        if: inputs.run-k8s-validate
        shell: bash
        env:
          K8S_MANIFESTS_DIR: ${{ inputs.k8s-manifests-dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifest_files=("${K8S_MANIFESTS_DIR}"/*.yaml)
          if [[ ${#manifest_files[@]} -eq 0 ]]; then
            echo "::error::No Kubernetes manifests found in ${K8S_MANIFESTS_DIR}."
            exit 1
          fi
          for f in "${manifest_files[@]}"; do
            [[ "${f}" == *.example ]] && continue
            echo "Validating: ${f}"
            kubectl apply --dry-run=client -f "${f}"
          done

      - name: Validate Prometheus rules
        shell: bash
        if: inputs.run-prometheus-validate
        env:
          PROMETHEUS_RULES_DIR: ${{ inputs.prometheus-rules-dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          rule_files=("${PROMETHEUS_RULES_DIR}"/*.yaml)
          if [[ ${#rule_files[@]} -eq 0 ]]; then
            echo "::error::No Prometheus rule files found in ${PROMETHEUS_RULES_DIR}."
            exit 1
          fi
          docker run --rm --entrypoint promtool \
            -v "$PWD:/work" -w /work prom/prometheus:v2.53.0 \
            check rules "${rule_files[@]}"
