# =============================================================================
# Example: Helm deploy Caller workflow
# =============================================================================
# Copy this Caller workflow to your platform/infra Workflow consumer at
# .github/workflows/deploy.yml and adjust the inputs.
#
# This example shows deploying a single Helm release. For multi-release
# matrix deploys (like doks-platform), use a detect-releases job that
# calls this workflow once per release.
# =============================================================================

# Note: helm-deploy.yml@v2 restricts automatic real deployments to pushes on the
# repository default branch (`main` below), runs a dry-run on same-repository
# pull_request events (`deploy (dry-run) / <release-name>`), and rejects fork
# PRs, feature-branch pushes, pull_request_target, and unopted workflow_dispatch
# before acquiring cluster credentials.

name: deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/my-app/**"
  pull_request:
    paths:
      - "apps/my-app/**"

jobs:
  deploy:
    uses: nandohdc/gh-pipelines/.github/workflows/helm-deploy.yml@v2
    with:
      release-name: my-app
      chart: ./apps/my-app/chart
      namespace: my-app
      values-file: apps/my-app/values.yaml
      cluster-id: "adc9fd65-81f6-46f3-b3d1-6112298faf0a"
    secrets:
      digitalocean-token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
