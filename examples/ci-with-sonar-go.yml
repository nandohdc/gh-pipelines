# =============================================================================
# Example: Go service CI + Sonar bundle Caller workflow
# =============================================================================
# Copy this Caller workflow to your Go Workflow consumer at .github/workflows/ci.yml.
# Provide non-secret variables when available:
# - RUNNER_LABEL selects the ARC runner pool (for local-kind use arc-runners-<service>).
# - SONAR_SCANNER_HOST_URL is the scanner server URL; for local-kind ARC use
#   http://sonarqube.sonarqube.svc.cluster.local:9000.
# - SONAR_PUBLIC_BASE_URL is the stable public HTTPS UI/base URL and is not used
#   for scanner or quality-gate connectivity.
# Keep only DOPPLER_TOKEN as a repository secret. Use pull_request, not
# pull_request_target, so untrusted fork PRs do not receive secrets.
# =============================================================================

name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    uses: nandohdc/gh-pipelines/.github/workflows/ci-with-sonar-go.yml@v1
    with:
      go-version: "1.26.2"
      working-directory: "."
      coverage-min: "65.0"
      sonar-working-directory: "."
      sonar-quality-gate-timeout-minutes: 5
      sonar-extra-scan-args: ""
      sonar-scanner-host-url: ${{ vars.SONAR_SCANNER_HOST_URL }}
      sonar-public-base-url: ${{ vars.SONAR_PUBLIC_BASE_URL }}
      runner-label: ${{ vars.RUNNER_LABEL }}
      doppler-project: "sonar"
      doppler-config: "prd"
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
