# =============================================================================
# Example: Docker build caller workflow (optional hardening enabled)
# =============================================================================
# Enables SBOM generation, cosign keyless signing, SPDX SBOM attestation, and
# SLSA provenance for pushed images from docker-build.yml. The sign-image and
# attest-sbom jobs self-verify, so they fail closed if nothing is produced.
# =============================================================================

name: docker-build-hardened

on:
  push:
    branches:
      - main

jobs:
  build:
    uses: nandohdc/gh-pipelines/.github/workflows/docker-build.yml@v1
    with:
      image-name: ghcr.io/${{ github.repository }}
      generate-sbom: true
      sign-image: true
      attest-sbom: true
      generate-provenance: true
    permissions:
      contents: read
      packages: write
      actions: write
      id-token: write
      attestations: write
