# =============================================================================
# Example: Go service CI Caller workflow
# =============================================================================
# Copy this Caller workflow to your Go Workflow consumer at
# .github/workflows/ci.yml and adjust the inputs to match your project.
# =============================================================================

name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    uses: nandohdc/gh-pipelines/.github/workflows/ci-go.yml@v1
    with:
      go-version: "1.26.2"
      cache-dependency-path: "go.sum"
      golangci-lint-version: "v1.64.8"
      golangci-lint-major: "1"
      coverage-min: "65.0"
      coverage-packages: "./internal/canonical ./internal/config ./internal/db ./internal/health ./internal/httpx ./internal/observability ./internal/outbox ./internal/requestid"
      # Optional combined coverage: set coverage-tags: integration and
      # coverage-instrument-packages: ./..., then label the report combined.
      run-integration: true
      integration-tags: "integration"
      integration-packages: "./internal/..."
      run-contract: true
      run-import-direction: true
      run-k8s-validate: true
      k8s-manifests-dir: "deploy/kubernetes"
      run-prometheus-validate: true
      prometheus-rules-dir: "deploy/prometheus"

  build-image:
    uses: nandohdc/gh-pipelines/.github/workflows/security-scan.yml@v1
    with:
      image-ref: "my-app:ci"
      build-image: true
      severity: "HIGH,CRITICAL"
