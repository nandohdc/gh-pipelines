sonar.projectKey=nandohdc_gh-pipelines_7ee6bd5a-8a54-4996-a00d-668315012f38
sonar.projectName=gh-pipelines
sonar.sources=.github,actions,examples,scripts,docs,README.md,SECURITY.md,CHANGELOG.md,AGENTS.md,CLAUDE.md,GEMINI.md
sonar.tests=tests,scripts
# The Python files in scripts/ are static contract tests, not product code:
# classify them as test code so the quality gate does not demand coverage for
# them. sonar.exclusions removes them from sources; sonar.test.inclusions
# limits which files under sonar.tests count as tests.
sonar.test.inclusions=scripts/*_test.py
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/.pytest_cache/**,**/.ruff_cache/**,**/.scannerwork/**,scripts/*_test.py
