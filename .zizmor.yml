rules:
  unpinned-uses:
    config:
      policies:
        # GitHub-owned actions in this repo intentionally use readable tag pins.
        "actions/*": ref-pin
        "github/*": ref-pin
        # Internal reusable actions are consumed through maintained v1 tags.
        "nandohdc/gh-pipelines/*": ref-pin

  dangerous-triggers:
    ignore:
      # This workflow intentionally uses pull_request_target and never checks out PR code.
      - dependabot-auto-merge.yml

  template-injection:
    ignore:
      # workflow_call inputs in ci-node are validated and constrained by the workflow interface.
      - ci-node.yml:88
      - ci-node.yml:91
      - ci-node.yml:114
      - ci-node.yml:125
      - ci-node.yml:136
      - ci-node.yml:147
      - ci-node.yml:169
      - ci-node.yml:172
      - ci-node.yml:195
      - ci-node.yml:206
      - ci-node.yml:219
      - ci-node.yml:230
      - ci-node.yml:276
      - ci-node.yml:279
      - ci-node.yml:302
      - ci-node.yml:313
      - ci-node.yml:324
      - ci-node.yml:339
      # Helm deploy interface values are constrained by trusted pipeline callers.
      - helm-deploy.yml:115
      - helm-deploy.yml:116
      - helm-deploy.yml:118
      - helm-deploy.yml:120
      - helm-deploy.yml:123
      - helm-deploy.yml:128
      - helm-deploy.yml:154
