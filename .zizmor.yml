rules:
  unpinned-uses:
    config:
      policies:
        # GitHub-owned actions in this repo intentionally use readable tag pins.
        "actions/*": ref-pin
        "github/*": ref-pin
        # Internal reusable actions are consumed through maintained v1 tags.
        "nandohdc/gh-pipelines/*": ref-pin

  dangerous-triggers:
    ignore:
      # This workflow intentionally uses pull_request_target and never checks out PR code.
      - dependabot-auto-merge.yml
