name: "Setup Go"
description: "Setup Go toolchain with module caching and dependency download."

inputs:
  go-version:
    description: "Go version to install."
    required: false
    default: "1.26.2"
  cache:
    description: "Enable Go module caching."
    required: false
    default: "true"
  cache-dependency-path:
    description: "Path to the go.sum file used for the Go module cache key. Empty resolves to <working-directory>/go.sum."
    required: false
    default: ""
  working-directory:
    description: "Directory containing go.mod."
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Resolve Go module cache
      id: cache
      shell: bash
      env:
        CACHE_ENABLED: ${{ inputs.cache }}
        CACHE_DEPENDENCY_PATH: ${{ inputs.cache-dependency-path }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        dependency_path="${CACHE_DEPENDENCY_PATH}"
        if [ -z "${dependency_path}" ]; then
          dependency_path="${WORKING_DIRECTORY}/go.sum"
        fi

        if [ "${CACHE_ENABLED}" = "true" ] && [ -f "${dependency_path}" ]; then
          echo "enabled=true" >> "${GITHUB_OUTPUT}"
          echo "dependency-path=${dependency_path}" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        echo "enabled=false" >> "${GITHUB_OUTPUT}"
        echo "dependency-path=" >> "${GITHUB_OUTPUT}"
        if [ "${CACHE_ENABLED}" = "true" ]; then
          echo "::notice::Go module cache disabled because ${dependency_path} does not exist."
        fi

    - name: Set up Go ${{ inputs.go-version }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ steps.cache.outputs.enabled }}
        cache-dependency-path: ${{ steps.cache.outputs.dependency-path }}

    - name: Download modules
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ -f go.mod ]; then
          go mod download
        else
          echo "::notice::No go.mod found in '${WORKING_DIRECTORY}'; skipping go mod download."
        fi
