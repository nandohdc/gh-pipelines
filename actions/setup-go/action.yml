name: "Setup Go"
description: "Setup Go toolchain with module caching and dependency download."

inputs:
  go-version:
    description: "Go version to install."
    required: false
    default: "1.26.2"
  cache:
    description: "Enable Go module caching."
    required: false
    default: "true"
  working-directory:
    description: "Directory containing go.mod."
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Set up Go ${{ inputs.go-version }}
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}

    - name: Download modules
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ -f go.mod ]; then
          go mod download
        else
          echo "::notice::No go.mod found in '${WORKING_DIRECTORY}'; skipping go mod download."
        fi
