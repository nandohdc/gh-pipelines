name: "Setup Go"
description: "Setup Go toolchain with module caching and dependency download."

inputs:
  go-version:
    description: "Go version to install."
    required: false
    default: "1.26.2"
  cache:
    description: "Enable Go module caching."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Go ${{ inputs.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}

    - name: Download modules
      shell: bash
      run: go mod download
