name: "Setup Node"
description: "Setup Node.js with package-manager-aware dependency caching."

inputs:
  node-version:
    description: "Node.js version to install."
    required: false
    default: "20"
  package-manager:
    description: "Package manager to use (npm|pnpm|yarn)."
    required: false
    default: "npm"
  cache:
    description: "Enable package-manager dependency cache."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Validate package manager
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        set -euo pipefail
        case "${PACKAGE_MANAGER}" in
          npm|pnpm|yarn) ;;
          *)
            echo "::error::Unsupported package-manager '${PACKAGE_MANAGER}'. Use npm, pnpm, or yarn."
            exit 1
            ;;
        esac

    - name: Set up Node ${{ inputs.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable Corepack
      if: inputs.package-manager != 'npm'
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        CACHE_ENABLED: ${{ inputs.cache }}
      run: |
        set -euo pipefail
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        echo "COREPACK_ENABLE_DOWNLOAD_PROMPT=0" >> "${GITHUB_ENV}"
        corepack enable
        if [ "${PACKAGE_MANAGER}" = "pnpm" ] && [ "${CACHE_ENABLED}" = "true" ]; then
          (
            cd "${GITHUB_WORKSPACE:-.}" && mkdir -p "$(pnpm store path --silent)"
          )
        fi

    - name: Configure Node ${{ inputs.package-manager }} cache
      if: inputs.cache == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}
        cache-dependency-path: ${{ inputs.package-manager == 'npm' && '**/package-lock.json' || inputs.package-manager == 'pnpm' && '**/pnpm-lock.yaml' || '**/yarn.lock' }}
