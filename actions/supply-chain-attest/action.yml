name: "Supply Chain Attest"
description: "Generate SBOM artifacts, sign images, and emit provenance by digest."

inputs:
  image-name:
    description: "Full image name including registry."
    required: true
  image-digest:
    description: "Image digest (sha256:...)."
    required: true
  generate-sbom:
    description: "Generate SPDX and CycloneDX SBOM artifacts."
    required: false
    default: "false"
  generate-provenance:
    description: "Generate SLSA provenance attestation."
    required: false
    default: "false"
  sign-image:
    description: "Sign image digest using cosign keyless mode."
    required: false
    default: "false"
  attest-sbom:
    description: "Emit the SPDX SBOM as a cosign attestation (cosign attest --type spdxjson) on the image digest. Requires registry push credentials (GHCR login) and id-token: write."
    required: false
    default: "false"
  platforms:
    description: "Comma-separated target platforms the image was built for (e.g. linux/amd64,linux/arm64). The SBOM is generated for the first listed platform. Empty lets syft auto-detect from the runner's platform."
    required: false
    default: ""
  sbom-artifact-suffix:
    description: "Suffix appended to SBOM artifact names."
    required: false
    default: "run"
  sbom-spdx-output:
    description: "Output path for SPDX JSON SBOM."
    required: false
    default: "sbom.spdx.json"
  sbom-cyclonedx-output:
    description: "Output path for CycloneDX JSON SBOM."
    required: false
    default: "sbom.cyclonedx.json"

runs:
  using: "composite"
  steps:
    # Syft resolves an image index at the runner's host platform by default, which
    # fails when the runner arch (e.g. arm64 self-hosted) is not among the built
    # platforms. Pin SYFT_PLATFORM to the first built platform so SBOM generation
    # is deterministic regardless of runner arch. An empty input yields an empty
    # SYFT_PLATFORM, which is syft's own default (no platform constraint), so
    # auto-detect behavior is preserved. Step output (not GITHUB_ENV) keeps the
    # zizmor github-env gate clean.
    - name: Resolve SBOM platform
      id: sbom-platform
      if: ${{ inputs.generate-sbom == 'true' || inputs.attest-sbom == 'true' }}
      shell: bash
      env:
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        set -euo pipefail
        platform="${PLATFORMS%%,*}"
        echo "platform=${platform}" >> "$GITHUB_OUTPUT"
        echo "SBOM platform pinned to '${platform}' (empty = syft auto-detect)"

    - name: Generate SPDX SBOM
      if: ${{ inputs.generate-sbom == 'true' || inputs.attest-sbom == 'true' }}
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      env:
        SYFT_PLATFORM: ${{ steps.sbom-platform.outputs.platform }}
      with:
        image: ${{ inputs.image-name }}@${{ inputs.image-digest }}
        format: spdx-json
        output-file: ${{ inputs.sbom-spdx-output }}
        artifact-name: sbom-spdx-${{ inputs.sbom-artifact-suffix }}
        upload-artifact: true
        upload-release-assets: false

    - name: Generate CycloneDX SBOM
      if: ${{ inputs.generate-sbom == 'true' }}
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      env:
        SYFT_PLATFORM: ${{ steps.sbom-platform.outputs.platform }}
      with:
        image: ${{ inputs.image-name }}@${{ inputs.image-digest }}
        format: cyclonedx-json
        output-file: ${{ inputs.sbom-cyclonedx-output }}
        artifact-name: sbom-cyclonedx-${{ inputs.sbom-artifact-suffix }}
        upload-artifact: true
        upload-release-assets: false

    - name: Ensure envsubst is available for cosign installer
      if: ${{ inputs.sign-image == 'true' || inputs.attest-sbom == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if command -v envsubst >/dev/null 2>&1; then
          envsubst --version || true
          exit 0
        fi
        if [ "$(uname -s)" != "Linux" ]; then
          echo "envsubst is missing: automatic gettext-base install is only supported on Linux runners. Install gettext-base in the runner image." >&2
          exit 1
        fi
        if ! command -v apt-get >/dev/null 2>&1; then
          echo "envsubst is missing and apt-get is unavailable. Install gettext-base in the runner image." >&2
          exit 1
        fi
        # Privilege-aware install: root containers have no sudo; locked-down ARC/self-hosted
        # images have no passwordless sudo. Running sudo unconditionally breaks both (issue #102).
        if [ "$(id -u)" = "0" ]; then
          apt-get update
          apt-get install -y gettext-base
        elif sudo -n true 2>/dev/null; then
          sudo apt-get update
          sudo apt-get install -y gettext-base
        else
          echo "envsubst is missing and gettext-base cannot be installed: not running as root and passwordless sudo is unavailable. Install gettext-base in the runner image (apt-get install -y gettext-base)." >&2
          exit 1
        fi
        command -v envsubst >/dev/null 2>&1

    - name: Install cosign
      if: ${{ inputs.sign-image == 'true' || inputs.attest-sbom == 'true' }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign image (keyless)
      if: ${{ inputs.sign-image == 'true' }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        IMAGE_DIGEST: ${{ inputs.image-digest }}
      run: |
        set -euo pipefail
        cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

    - name: Attest SPDX SBOM (keyless)
      if: ${{ inputs.attest-sbom == 'true' }}
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        IMAGE_DIGEST: ${{ inputs.image-digest }}
        SBOM_SPDX_OUTPUT: ${{ inputs.sbom-spdx-output }}
      run: |
        set -euo pipefail
        # Pin the legacy .att DSSE tag scheme. cosign v3 defaults to the new Sigstore
        # bundle format attached via the OCI 1.1 referrers API, which does not round-trip
        # reliably on GHCR — verify-attestation then fails closed with "no valid bundles
        # exist in registry" (issue #104). Two flags are required together:
        #   --new-bundle-format=false  -> store the attestation as a legacy .att tag
        #   --use-signing-config=false -> opt out of the TUF signing-config, which cosign
        #                                 v3 otherwise requires alongside the new bundle
        #                                 format ("must provide --new-bundle-format ...
        #                                 with --signing-config or --use-signing-config").
        # Keyless Fulcio + Rekor tlog upload stay on (defaults), so identity/issuer/tlog
        # verification by docker-build.yml (--new-bundle-format=false) is unchanged.
        cosign attest --yes \
          --new-bundle-format=false \
          --use-signing-config=false \
          --predicate "${SBOM_SPDX_OUTPUT}" \
          --type spdxjson \
          "${IMAGE_NAME}@${IMAGE_DIGEST}"

    - name: Generate SLSA provenance attestation
      if: ${{ inputs.generate-provenance == 'true' }}
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{ inputs.image-name }}
        subject-digest: ${{ inputs.image-digest }}
        push-to-registry: true
