name: "Setup doctl"
description: "Install doctl CLI and load a DigitalOcean Kubernetes cluster kubeconfig."

inputs:
  digitalocean-token:
    description: "DigitalOcean Personal Access Token."
    required: true
  cluster-id:
    description: "DigitalOcean Kubernetes cluster UUID."
    required: true

runs:
  using: "composite"
  steps:
    - name: Install doctl
      uses: digitalocean/action-doctl@135ac0aa0eed4437d547c6f12c364d3006b42824 # v2.5.1
      with:
        token: ${{ inputs.digitalocean-token }}

    - name: Load kubeconfig
      shell: bash
      run: doctl kubernetes cluster kubeconfig save "${{ inputs.cluster-id }}"
