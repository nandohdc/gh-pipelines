name: "Setup doctl"
description: "Install doctl CLI and load a DigitalOcean Kubernetes cluster kubeconfig."

inputs:
  digitalocean-token:
    description: "DigitalOcean Personal Access Token."
    required: true
  cluster-id:
    description: "DigitalOcean Kubernetes cluster UUID."
    required: true

runs:
  using: "composite"
  steps:
    - name: Install doctl
      uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
      with:
        token: ${{ inputs.digitalocean-token }}

    - name: Set up kubectl
      uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

    - name: Load kubeconfig
      shell: bash
      env:
        CLUSTER_ID: ${{ inputs.cluster-id }}
      run: doctl kubernetes cluster kubeconfig save "${CLUSTER_ID}"
